{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTech - Cadastro</title>
    <link rel="stylesheet" href="{% static 'css/login/cadastrar.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="main-box">
            <div class="logo">
                <i class="fa-solid fa-seedling" style="color:#2D6A47; font-size:32px;"></i>
            </div>
            <h1>AgroTech</h1>
            <p class="subtitle">Tecnologia para agricultura familiar</p>
            
            <div class="tabs">
                <a href="{% url 'login' %}" class="tab-button active">Entrar</a>
                <a href="{% url 'register' %}" class="tab-button">Cadastrar</a>
            </div>
            
            <form class="signup-form" method="post">
                <div class="input-group">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Registrar</button>
                    
                </div>
                
                <button type="submit" class="action-button">Criar Conta</button>
            </form>
            
            <div class="back-link">
                <a href="{% url 'index' %}">← Voltar ao Início</a>
            </div>
        </div>
    </div>
</body>
</html>
