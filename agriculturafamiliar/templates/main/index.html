{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="stylesheet" href="{% static 'css/main/style.css' %}">
</head>
<body>

        <button type="submit">Sair</button>
    </form>
    {% endif %}
</body>
</html>
